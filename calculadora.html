<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Calculadora</title>

    <style>

        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-top: 20px;
        }

        #calculator {
            display: inline-block;
            text-align: left;
            border: 1px solid #ccc;
            padding: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
            margin: 0 auto;
        }

        input[type="text"] {
            width: 90%;
            padding: 10px;
            font-size: 20px;
            text-align: right;
        }

        input[type="button"] {
            width: 60px;
            height: 50px;
            font-size: 20px;
            margin: 5px;
        }

        #etapas {
            margin-top: 10px;
            font-size: 18px;
            text-align: right;
            white-space: nowrap;
        }

    </style>

</head>

<body>

    <h1>Calculadora</h1>

    <div id="calculator">

        <form>

            <input type="text" id="etapas" placeholder="0" readonly><br>

            <input type="button" value="1" onclick="adicionarNumero(1)">
            <input type="button" value="2" onclick="adicionarNumero(2)">
            <input type="button" value="3" onclick="adicionarNumero(3)">
            <input type="button" value="+" onclick="definirOperacao('+')">

            <br>

            <input type="button" value="4" onclick="adicionarNumero(4)">
            <input type="button" value="5" onclick="adicionarNumero(5)">
            <input type="button" value="6" onclick="adicionarNumero(6)">
            <input type="button" value="-" onclick="definirOperacao('-')">

            <br>

            <input type="button" value="7" onclick="adicionarNumero(7)">
            <input type="button" value="8" onclick="adicionarNumero(8)">
            <input type="button" value="9" onclick="adicionarNumero(9)">
            <input type="button" value="*" onclick="definirOperacao('*')">

            <br>

            <input type="button" value="0" onclick="adicionarNumero(0)">
            <input type="button" value="/" onclick="definirOperacao('/')">
            <input type="button" value="=" onclick="calcular()">
            <input type="button" value="C" onclick="limpar()">

            <br>

            <input type="button" value="log" onclick="calcularLog()">

        </form>

    </div>

    <script>

        var etapasInput = document.getElementById("etapas");

        var etapas = "";

        function adicionarNumero(numero) {
            etapas += numero;
            etapasInput.value = etapas;
        }

        function definirOperacao(operacao) {
            etapas += " " + operacao + " ";
            etapasInput.value = etapas;
        }

        function calcular() {

            try {
                etapas = eval(etapas).toString();
                etapasInput.value = etapas;

            } catch (error) {

                etapasInput.value = 'Erro';
            }
        }

        function calcularLog() {

            try {

                let numero = parseFloat(etapas);

                if (numero > 0) {

                    etapas = Math.log(numero).toString();
                    etapasInput.value = etapas;

                } else {

                    etapasInput.value = "Erro";
                }

            } catch (error) {

                etapasInput.value = "Erro";
            }
        }

        function limpar() {

            etapas = "";
            etapasInput.value = "";
        }

    </script>

</body>

</html>
